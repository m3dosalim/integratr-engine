# Local run of the Engine shell.
#
# Three processes share one database:
#   1. Postgres. Budgets and the pipe registry both need it.
#   2. LiteLLM proxy. This is the Gateway, Control, and Monitor.
#   3. The Integratr shell. This is the Integration layer.
#
# Folding these into one image is a later deploy step.
# From this folder: copy .env.example to .env, then `docker compose up --build`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: integratr
      POSTGRES_PASSWORD: integratr
      POSTGRES_DB: integratr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integratr -d integratr"]
      interval: 2s
      timeout: 5s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./engine/litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://integratr:integratr@postgres:5432/integratr
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CHAT_DEFAULT_MODEL: ${CHAT_DEFAULT_MODEL:-openai/gpt-4o-mini}
      CHAT_DEFAULT_API_KEY: ${CHAT_DEFAULT_API_KEY:-sk-not-set}
      IMAGE_DEFAULT_MODEL: ${IMAGE_DEFAULT_MODEL:-openai/gpt-image-1}
      IMAGE_DEFAULT_API_KEY: ${IMAGE_DEFAULT_API_KEY:-sk-not-set}
      EMBED_DEFAULT_MODEL: ${EMBED_DEFAULT_MODEL:-openai/text-embedding-3-small}
      EMBED_DEFAULT_API_KEY: ${EMBED_DEFAULT_API_KEY:-sk-not-set}
      SPEECH_DEFAULT_MODEL: ${SPEECH_DEFAULT_MODEL:-openai/tts-1}
      SPEECH_DEFAULT_API_KEY: ${SPEECH_DEFAULT_API_KEY:-sk-not-set}
      TRANSCRIBE_DEFAULT_MODEL: ${TRANSCRIBE_DEFAULT_MODEL:-openai/whisper-1}
      TRANSCRIBE_DEFAULT_API_KEY: ${TRANSCRIBE_DEFAULT_API_KEY:-sk-not-set}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  engine:
    build: ./engine
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "4100:4100"
    environment:
      DATABASE_URL: postgresql://integratr:integratr@postgres:5432/integratr
      LITELLM_INTERNAL_URL: http://litellm:4000
      ENGINE_BASE_URL: ${ENGINE_BASE_URL:-http://localhost:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ENGINE_ADMIN_TOKEN: ${ENGINE_ADMIN_TOKEN}
      HEALTH_POLL_SECONDS: ${HEALTH_POLL_SECONDS:-15}
